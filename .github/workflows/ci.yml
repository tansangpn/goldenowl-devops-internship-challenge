name: CI/CD Pipeline
#code mới đẩy lên các nhánh feature
on:
  push:
    branches: ["feature/*", "main", "master"]
  pull_request:
    branches: ["main", "master"]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    - name: Install dependencies
      run: npm install 
    - name: Run tests
      run: npm test
  build-and-push-docker:
    needs: build-and-test #chỉ chạy khi Job trên chạy thành công 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and push Docker image
      uses: docker/build-push-action@v6 
      with:
        context: . #build ngay tại thư mục gốc
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME}}/app-test-intern:latest
          ${{ secrets.DOCKER_USERNAME}}/app-test-intern:${{ github.sha }}
